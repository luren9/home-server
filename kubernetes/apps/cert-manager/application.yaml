apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cert-manager
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: "1.19.1"

      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/kubernetes/apps/cert-manager/values.yaml

    - repoURL: https://github.com/luren9/home-server.git
      targetRevision: main
      ref: values

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
