apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cilium
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  sources:
    - repoURL: https://helm.cilium.io
      chart: cilium
      targetRevision: "1.18.2"

      helm:
        releaseName: cilium
        valueFiles:
          - $values/kubernetes/apps/cilium/values.yaml

    - repoURL: https://github.com/luren9/home-server.git
      targetRevision: main
      ref: values

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # Snippet taken from
  # https://docs.cilium.io/en/latest/configuration/argocd-issues/
  ignoreDifferences:
  - group: ""
    kind: ConfigMap
    name: hubble-ca-cert
    jsonPointers:
    - /data/ca.crt
  - group: ""
    kind: Secret
    name: hubble-relay-client-certs
    jsonPointers:
    - /data/ca.crt
    - /data/tls.crt
    - /data/tls.key
  - group: ""
    kind: Secret
    name: hubble-server-certs
    jsonPointers:
    - /data/ca.crt
    - /data/tls.crt
    - /data/tls.key
